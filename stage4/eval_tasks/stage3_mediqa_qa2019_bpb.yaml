task: stage3_mediqa_qa2019_bpb
dataset_path: bigbio/mediqa_qa
description: >
  Instructions: The following text is a question asked by a patient. Answer how a doctor would, while trying to be as informative and helpful as possible.
output_type: loglikelihood_rolling
training_split: train_live_qa_med
validation_split: validation
test_split: test
doc_to_text: ""
doc_to_target: "{{QUESTION.AnswerList[0].Answer.AnswerText}}"
should_decontaminate: true
doc_to_decontamination_query: "{{QUESTION.AnswerList[0].Answer.AnswerText}}"
metric_list:
  - metric: bits_per_byte
    aggregation: bits_per_byte
    higher_is_better: false
metadata:
  version: 1.0
